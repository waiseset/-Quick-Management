# 本机直连 crates.io 索引很慢（单次请求 5–11 秒），这里改用 rsproxy 稀疏镜像加速。
# src-tauri/.cargo/config.toml 里有同样一份，供在 src-tauri 目录下执行 cargo 时使用。
# 如果所在网络访问 crates.io 正常，可以删除这两个文件回到官方源。
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "sparse+https://rsproxy.cn/index/"
